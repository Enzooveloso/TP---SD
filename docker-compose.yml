services:
  db:
    image: postgres:15
    container_name: monografias_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-si}
      POSTGRES_USER: ${POSTGRES_USER:-si}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-si}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: monografias_backend
    env_file:
      - .env
    volumes:
      - .:/app
      - venv_data:/app/.venv
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  venv_data:
