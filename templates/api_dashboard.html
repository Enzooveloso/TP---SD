{% extends 'base.html' %}

{% block title %}Dashboard API{% endblock %}

{% block content %}
<h1>Dashboard (API)</h1>
<p>Exemplos de integração usando fetch com os endpoints REST.</p>

<h2>Monografias aprovadas (público)</h2>
<pre id="monografias-aprovadas" style="padding:12px; background:#f7f7f7; border-radius:6px; overflow:auto; max-height:200px;">Carregando...</pre>

<div style="display:flex; flex-wrap:wrap; gap:20px; margin-top:20px;">
    <div style="flex:1 1 300px;">
        <h3>Monografias por ano</h3>
        <canvas id="chartAno"></canvas>
    </div>
    <div style="flex:1 1 300px;">
        <h3>Por área de pesquisa</h3>
        <canvas id="chartArea"></canvas>
    </div>
    <div style="flex:1 1 300px;">
        <h3>Por status</h3>
        <canvas id="chartStatus"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
async function fetchJSON(url) {
    const resp = await fetch(url);
    return resp.json();
}

async function loadMonografias() {
    const data = await fetchJSON('/api/public/monografias/');
    document.getElementById('monografias-aprovadas').textContent =
        JSON.stringify(data, null, 2);
}

function buildChart(ctxId, labels, values, label) {
    const ctx = document.getElementById(ctxId);
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [{
                label,
                data: values,
                backgroundColor: 'rgba(0, 123, 255, 0.5)',
                borderColor: 'rgba(0, 123, 255, 1)',
                borderWidth: 1
            }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
    });
}

async function loadCharts() {
    const porAno = await fetchJSON('/api/stats/monografias_por_ano/');
    buildChart('chartAno', porAno.map(i => i.ano), porAno.map(i => i.total), 'Monografias');

    const porArea = await fetchJSON('/api/stats/monografias_por_area/');
    buildChart('chartArea', porArea.map(i => i.area || 'Sem área'), porArea.map(i => i.total), 'Total');

    const porStatus = await fetchJSON('/api/stats/monografias_por_status/');
    buildChart('chartStatus', porStatus.map(i => i.status), porStatus.map(i => i.total), 'Total');
}

document.addEventListener('DOMContentLoaded', () => {
    loadMonografias();
    loadCharts();
});
</script>
{% endblock %}
