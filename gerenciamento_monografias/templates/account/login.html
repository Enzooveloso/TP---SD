{% extends 'base.html' %}

{% block title %}Login | Gerenciador de Monografias{% endblock %}

{% block content %}
<div class="form-container">
    <header class="form-header">
        <h1>Bem-vindo!</h1>
        <p>Faça login para continuar</p>
    </header>

    <section class="form-content">
        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="form-button" type="submit">Entrar</button>
        </form>
    </section>

    <footer class="form-links">
        <a href="{% url 'account_reset_password' %}">Esqueceu sua senha?</a> |
        <a href="{% url 'account_signup' %}">Não tem uma conta? Cadastre-se</a>
    </footer>
</div>
{% endblock %}
