{% extends 'base.html' %}

{% block title %}Cadastro | Gerenciador de Monografias{% endblock %}

{% block content %}
<div class="form-container">
    <header class="form-header">
        <h1>Crie sua Conta</h1>
        <p>É rápido e fácil, vamos começar!</p>
    </header>

    <section class="form-content">
        <form method="post" action="{% url 'account_signup' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="form-button" type="submit">Cadastrar</button>
        </form>
    </section>

    <footer class="form-links">
        <a href="{% url 'account_login' %}">Já tem uma conta? Faça o login</a>
    </footer>
</div>
{% endblock %}
