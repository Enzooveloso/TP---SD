{% extends 'base.html' %}

{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<div class="form-container">
    <header class="form-header">
        <h1>Esqueceu sua senha?</h1>
        <p>Digite seu e-mail abaixo e enviaremos as instruções para redefinir sua senha.</p>
    </header>

    <section class="form-content">
        <form method="post" action="{% url 'account_reset_password' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="form-button" type="submit">Enviar E-mail de Redefinição</button>
        </form>
    </section>
</div>
{% endblock %}
