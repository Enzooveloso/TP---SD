services:
  db:
    image: postgres:16-alpine
    container_name: si_db
    environment:
      POSTGRES_DB: ${DB_NAME:-si}
      POSTGRES_USER: ${DB_USER:-si}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-si}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: